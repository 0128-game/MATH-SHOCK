<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Math Time Shock - Custom</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 600px; height: 600px; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: relative; z-index: 10; width: 350px; text-align: center; }
        #question { font-size: 1.8rem; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px #00d4ff; height: 4rem; display: flex; align-items: center; justify-content: center; }
        input[type="text"] { background: rgba(255,255,255,0.1); border: 2px solid #444; color: white; font-size: 2rem; width: 180px; padding: 10px; text-align: center; border-radius: 5px; outline: none; }
        input[type="text"]:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.5); }
        .hidden { display: none !important; }
        #setup-screen, #result-screen { position: absolute; z-index: 20; background: #111; padding: 40px; border-radius: 10px; border: 1px solid #333; width: 380px; text-align: center; }
        button { padding: 12px 30px; font-size: 1.1rem; cursor: pointer; background: #e67e22; border: none; border-radius: 4px; color: white; font-weight: bold; }
        input#json-filename { padding: 12px; font-size: 1rem; width: 80%; margin-bottom: 20px; background: #222; border: 1px solid #444; color: white; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="timerCanvas" width="600" height="600"></canvas>

    <div id="setup-screen">
        <h1 style="color:#00d4ff; margin-top:0;">TIME SHOCK</h1>
        <input type="text" id="json-filename" placeholder="ファイル名を入力 (例: math001)">
        <button onclick="loadQuizData()">GAME START</button>
        <p id="msg" style="color:#ff4757;"></p>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="q-number" style="font-size: 1.1rem; color: #aaa;">QUESTION 1</div>
        <div id="question">Preparing...</div>
        <input type="text" id="answer-input" autocomplete="off">
    </div>

    <div id="result-screen" class="hidden">
        <h2 id="res-title">RESULT</h2>
        <div id="final-score" style="font-size: 3rem; margin: 20px 0;"></div>
        <button onclick="location.reload()">BACK TO TITLE</button>
    </div>
</div>

<script>
    let quizList = [];
    let currentIdx = 0;
    let results = []; // 正誤履歴 (true:正解, false:不正解)
    let timeLeft = 0;
    let totalTimeLimit = 0;
    let lastTime = 0;
    let isRunning = false;
    
    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d');
    const inputEl = document.getElementById('answer-input');

    async function loadQuizData() {
        const filename = document.getElementById('json-filename').value.trim() || "math001";
        try {
            const response = await fetch(`./${filename}.json`);
            if (!response.ok) throw new Error("JSONファイルが見つかりません");
            const data = await response.json();
            quizList = data.quiz;
            results = new Array(quizList.length).fill(null);
            startQuiz();
        } catch (err) {
            document.getElementById('msg').innerText = err.message;
        }
    }

    function startQuiz() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        currentIdx = 0;
        isRunning = true;
        showQuestion();
        requestAnimationFrame(updateFrame);
    }

    function showQuestion() {
        if (currentIdx >= quizList.length) return endGame();
        
        document.getElementById('q-number').innerText = `QUESTION ${currentIdx + 1}`;
        document.getElementById('question').innerText = quizList[currentIdx].question;
        
        inputEl.value = "";
        inputEl.focus();
        
        totalTimeLimit = quizList[currentIdx].time * 1000;
        timeLeft = totalTimeLimit;
        lastTime = performance.now();
    }

    function updateFrame(time) {
        if (!isRunning) return;
        const dt = time - lastTime;
        lastTime = time;
        timeLeft -= dt;

        if (timeLeft <= 0) {
            submitAnswer(false); // 時間切れは不正解
        }

        drawCanvas();
        requestAnimationFrame(updateFrame);
    }

    function drawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const outerR = 260;
        const innerR = 225;

        // 1. 外側の円: 今の問題の残り時間 (時計回りに減っていく)
        const timeRatio = Math.max(0, timeLeft / totalTimeLimit);
        ctx.beginPath();
        ctx.lineWidth = 12;
        ctx.strokeStyle = timeRatio > 0.3 ? '#00d4ff' : '#ff4757';
        // -PI/2 (真上) から、残り時間分だけ円を描く
        ctx.arc(cx, cy, outerR, -Math.PI/2, -Math.PI/2 + (Math.PI * 2 * timeRatio), false);
        ctx.stroke();

        // 2. 内側の円: 12問の正誤履歴
        const segmentCount = quizList.length;
        const gap = 0.05; // セグメント間の隙間
        for (let i = 0; i < segmentCount; i++) {
            const startAngle = -Math.PI/2 + (Math.PI * 2 / segmentCount) * i + gap;
            const endAngle = -Math.PI/2 + (Math.PI * 2 / segmentCount) * (i + 1) - gap;
            
            ctx.beginPath();
            ctx.lineWidth = 20;
            
            if (results[i] === true) ctx.strokeStyle = '#2ed573';      // 正解：緑
            else if (results[i] === false) ctx.strokeStyle = '#ff4757'; // 不正解：赤
            else ctx.strokeStyle = '#222';                             // 未回答：グレー
            
            ctx.arc(cx, cy, innerR, startAngle, endAngle);
            ctx.stroke();
        }

        // 装飾的なドット
        ctx.fillStyle = "#444";
        for (let i = 0; i < 60; i++) {
            const ang = (i * 6) * Math.PI / 180;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(ang) * 285, cy + Math.sin(ang) * 285, 1.5, 0, Math.PI*2);
            ctx.fill();
        }
    }

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const isCorrect = inputEl.value.trim() === quizList[currentIdx].answer.toString().trim();
            submitAnswer(isCorrect);
        }
    });

    function submitAnswer(isCorrect) {
        results[currentIdx] = isCorrect;
        currentIdx++;
        if (currentIdx < quizList.length) {
            showQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        isRunning = false;
        const correctCount = results.filter(r => r === true).length;
        document.getElementById('ui-layer').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${correctCount} / ${quizList.length}`;
        document.getElementById('res-title').innerText = correctCount === quizList.length ? "PERFECT!" : "GAME OVER";
    }
</script>

</body>
</html>
