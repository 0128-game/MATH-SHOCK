<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Math Time Shock - fixed</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { position: relative; width: 650px; height: 650px; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; z-index: 1; }
        #ui-layer { position: relative; z-index: 10; width: 350px; text-align: center; }
        #question { font-size: 2.2rem; font-weight: bold; margin-bottom: 25px; text-shadow: 0 0 10px #00d4ff; min-height: 5rem; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        input[type="text"] { background: rgba(0,0,0,0.9); border: 3px solid #333; color: white; font-size: 2.5rem; width: 100%; box-sizing: border-box; padding: 10px; text-align: center; outline: none; border-radius: 10px; }
        input[type="text"]:focus { border-color: #00d4ff; }
        .hidden { display: none !important; }
        #setup-screen, #result-screen { position: absolute; z-index: 20; background: #111; padding: 40px; border: 2px solid #444; width: 420px; text-align: center; box-shadow: 0 0 30px rgba(0,212,255,0.2); }
        button { padding: 15px 40px; font-size: 1.2rem; cursor: pointer; background: #f39c12; border: none; color: #fff; font-weight: bold; border-radius: 5px; }
        input#json-filename { padding: 12px; font-size: 1.2rem; width: 90%; margin-bottom: 20px; background: #222; border: 1px solid #555; color: white; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="timerCanvas" width="650" height="650"></canvas>

    <div id="setup-screen">
        <h1 style="color:#00d4ff; margin-bottom:30px;">TIME SHOCK</h1>
        <input type="text" id="json-filename" placeholder="ファイル名を入力">
        <button onclick="loadQuizData()">START</button>
        <p id="msg" style="color:#ff4757; margin-top:10px;"></p>
    </div>

    <div id="ui-layer" class="hidden">
        <div id="question">Loading...</div>
        <input type="text" id="answer-input" autocomplete="off">
    </div>

    <div id="result-screen" class="hidden">
        <h1 id="res-title">RESULT</h1>
        <div id="final-score" style="font-size: 4rem; margin: 20px 0;"></div>
        <button onclick="location.reload()">RETRY</button>
    </div>
</div>

<script>
    let quizList = [];
    let currentIdx = 0;
    let results = [];
    let gameTimeLimit = 0; 
    let gameStartTime = 0; // ゲーム全体の開始時間
    let questionStartTime = 0; // 各問題の開始時間
    let isRunning = false;
    
    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d');
    const inputEl = document.getElementById('answer-input');

    async function loadQuizData() {
        const filename = document.getElementById('json-filename').value.trim() || "math001";
        try {
            const response = await fetch(`./${filename}.json`);
            if (!response.ok) throw new Error("JSONが見つかりません");
            const data = await response.json();
            quizList = data.quiz;
            gameTimeLimit = data.time || 5; 
            results = new Array(quizList.length).fill(null);
            startQuiz();
        } catch (err) {
            document.getElementById('msg').innerText = err.message;
        }
    }

    function startQuiz() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        currentIdx = 0;
        isRunning = true;
        gameStartTime = performance.now(); // 全体の時計スタート
        showQuestion();
        requestAnimationFrame(updateFrame);
    }

    function showQuestion() {
        if (currentIdx >= quizList.length) return endGame();
        document.getElementById('question').innerText = quizList[currentIdx].question;
        inputEl.value = "";
        inputEl.focus();
        questionStartTime = performance.now(); // 個別の時計スタート
    }

    function updateFrame(now) {
        if (!isRunning) return;
        
        const totalElapsed = (now - gameStartTime) / 1000;
        const currentQElapsed = (now - questionStartTime) / 1000;

        // 個別の問題の制限時間判定
        if (currentQElapsed >= gameTimeLimit) {
            submitAnswer(false);
        }

        draw(totalElapsed);
        requestAnimationFrame(updateFrame);
    }

    function draw(totalElapsed) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const gap = 0.06;

        // --- 外側：24分割タイマー ---
        // time/2 秒で1セグメント進む = 1周 24セグメント
        const outerR = 285;
        const numOuter = 24;
        const secPerSegment = gameTimeLimit / 2; 
        
        // 何個のセグメントを灰色にするか（ゲーム全体の経過時間で計算）
        const segmentsToGray = Math.floor(totalElapsed / secPerSegment);

        for (let i = 0; i < numOuter; i++) {
            const sAngle = -Math.PI/2 + (Math.PI * 2 / numOuter) * i + gap;
            const eAngle = -Math.PI/2 + (Math.PI * 2 / numOuter) * (i + 1) - gap;
            
            ctx.beginPath();
            ctx.lineWidth = 18;
            // 経過した分だけ灰色、それ以外は青
            ctx.strokeStyle = (i < segmentsToGray) ? "#333" : "#00d4ff";
            ctx.arc(cx, cy, outerR, sAngle, eAngle);
            ctx.stroke();
        }

        // --- 内側：12分割正誤インジケータ ---
        const innerR = 235;
        const numInner = 12;
        for (let i = 0; i < numInner; i++) {
            const sAngle = -Math.PI/2 + (Math.PI * 2 / numInner) * i + gap;
            const eAngle = -Math.PI/2 + (Math.PI * 2 / numInner) * (i + 1) - gap;
            
            ctx.beginPath();
            ctx.lineWidth = 30;
            if (results[i] === true) ctx.strokeStyle = "#2ed573";      
            else if (results[i] === false) ctx.strokeStyle = "#ff4757"; 
            else ctx.strokeStyle = "#1a1a1a";                          
            ctx.arc(cx, cy, innerR, sAngle, eAngle);
            ctx.stroke();
        }

        // セパレーター（スポーク状の線）
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 5;
        for(let i=0; i<numInner; i++) {
            const ang = -Math.PI/2 + (Math.PI * 2 / numInner) * i;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang)*210, cy + Math.sin(ang)*210);
            ctx.lineTo(cx + Math.cos(ang)*310, cy + Math.sin(ang)*310);
            ctx.stroke();
        }
    }

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const userAns = inputEl.value.trim();
            const correctAns = quizList[currentIdx].answer.toString().trim();
            submitAnswer(userAns === correctAns);
        }
    });

    function submitAnswer(isCorrect) {
        if (!isRunning) return;
        results[currentIdx] = isCorrect;
        currentIdx++;
        if (currentIdx < quizList.length) {
            showQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        isRunning = false;
        const score = results.filter(r => r === true).length;
        document.getElementById('ui-layer').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${quizList.length}`;
        
        if (score === 12) {
            document.getElementById('res-title').innerText = "PERFECT!";
            document.getElementById('res-title').style.color = "#ffd700";
        }
    }
</script>

</body>
</html>
